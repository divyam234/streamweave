services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: streamweave
      POSTGRES_USER: streamweave
      POSTGRES_PASSWORD: streamweave
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamweave -d streamweave"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
