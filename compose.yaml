services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: media_engine
      POSTGRES_USER: media_engine
      POSTGRES_PASSWORD: media_engine
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_engine -d media_engine"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
